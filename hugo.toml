baseURL = 'https://mig217.github.io/'
languageCode = 'en-us'
title = "Mig's Blog"
theme = 'hugo-PaperMod'
publishDir = "docs"

enableInlineShortcodes = true
enableRobotsTXT = true
buildDrafts = false
buildFuture = false
buildExpired = false
enableEmoji = true
pygmentsUseClasses = true

[params]
  env = "production"  # 启用 Google Analytics、OpenGraph、Twitter Cards 等
  description = "Mingrui Guo's blog — AI research notes and PM thinking"
  author = "Mingrui Guo"  # 更新作者信息
  defaultTheme = "regular"
  mainSections = ["post"]  # 主页展示的文章目录
  ShowReadingTime = true  # 显示预计阅读时间
  ShowShareButtons = true  # 允许分享
  ShowToc = true  # 文章内显示目录
  comments = false  # 关闭评论
  ShowBreadCrumbs = true  # 面包屑导航
  ShowPostNavLinks = true  # 文章内的前后文章导航
  ShowWordCount = true  # 显示字数统计
  ShowCodeCopyButtons = true  # 代码块复制按钮
  ShowRssButtonInSectionTermList = true  # RSS 订阅按钮
  ShowAllPagesInArchive = true  # 归档页显示所有文章
  ShowPageNums = true  # 文章列表显示分页
  displayFullLangName = true  # 显示完整语言名称
  math = true
  

  [params.profileMode]
    enabled = false
    title = "Mig's Blog"
    imageUrl = "#"
    imageTitle = "Profile Image"
    buttons = [
      { name = "Archives", url = "archives" },
      { name = "Tags", url = "tags" }
    ]

  [params.homeInfoParams]
    Title = "Hi, I’m Mingrui 👋"
    Content = """
AI Product Manager with 8 years of internet experience, the last 4 focused on building AI products.

This blog has two threads: **AI research** — notes on LLM reasoning, agent architectures, and context engineering; and **PM thinking** — product decisions and lessons from building AI in a regulated industry.

I believe understanding the technology makes you a better product manager.
"""

   [[params.socialIcons]]
     name = "linkedin"
     title = "LinkedIn"
     url = "https://www.linkedin.com/in/mingrui-guo-3498a52b0"

   [[params.socialIcons]]
     name = "github"
     title = "View Source on Github"
     url = "https://github.com/mig217"
  
   [[params.socialIcons]]
     name = "X"
     title = "Share on X/Twitter"
     url = "https://x.com/wakaka7727"

  # [[params.socialIcons]]
  #   name = "KoFi"
  #   title = "Buy me a Ko-Fi :)"
  #   url = "https://ko-fi.com/mig217"

  # [params.editPost]
  #    URL = "https://github.com/mig217/blog/tree/main/content"
  #    Text = "Suggest Changes"
  #    appendFilePath = true

[minify]
  disableXML = true

[outputs]
  home = ["HTML", "RSS", "JSON"]

[menu]
  [[menu.main]]
    name = "Posts"
    url = "post/"
    weight = 1
  [[menu.main]]
    name = "Projects"
    url = "projects/"
    weight = 2
  [[menu.main]]
    name = "Archive"
    url = "archives/"
    weight = 3
  [[menu.main]]
    name = "Search"
    url = "search/"
    weight = 4
  [[menu.main]]
    name = "Tags"
    url = "tags/"
    weight = 5
  [[menu.main]]
    name = "FAQ"
    url = "faq/"
    weight = 6

[languages]
  [languages.en]
    languageName = "English"
    weight = 1

[markup]
  [markup.highlight]
    noClasses = false
    guessSyntax = true
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true

[assets]
  disableHLJS = true